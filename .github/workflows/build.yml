name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create the GitHub release v<project version> from this commit'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read the version from the project
        shell: pwsh
        run: |
          $version = ([xml](Get-Content PingBoost.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw 'No <Version> in PingBoost.csproj' }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish (self-contained, Windows x64)
        run: dotnet publish PingBoost.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Pack the build
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath "PingBoost-$env:VERSION-win-x64.zip"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: PingBoost-${{ env.VERSION }}-win-x64
          path: publish
          if-no-files-found: error

      - name: Create the GitHub release (v* tag or manual run with "publish")
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw "Tag $env:GITHUB_REF_NAME does not match project version $env:VERSION" }
          # Creates the tag at this commit when it does not exist yet.
          gh release create $tag "PingBoost-$env:VERSION-win-x64.zip" --target $env:GITHUB_SHA --title "PingBoost $env:VERSION" --notes-file .github/release-notes.md
