name: cleanup-artifacts

# Manual run: deletes artifacts with a retention longer than 8 days (the old 90-day ones) from finished runs.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deleted=0; kept=0
          while read -r id run_id; do
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .status 2>/dev/null || echo completed)
            if [ "$status" = "completed" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null && deleted=$((deleted+1))
            else
              kept=$((kept+1))
            fi
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
                     --jq '.artifacts[] | select(((.expires_at|fromdateiso8601) - (.created_at|fromdateiso8601)) > 8*86400) | "\(.id) \(.workflow_run.id)"')
          echo "Deleted: $deleted, kept (run still in progress): $kept"
